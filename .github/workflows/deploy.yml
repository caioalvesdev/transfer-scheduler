name: Deploy

on:
  workflow_run:
    workflows:
      - Testes
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'

    runs-on: ubuntu-latest
    environment: DEPLOY

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build Jar
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Frontend
        working-directory: frontend
        run: |
          pnpm install
          pnpm run build

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            caiodev027/desafiotecnico-backend:${{ github.event.workflow_run.head_sha }}
            caiodev027/desafiotecnico-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            caiodev027/desafiotecnico-frontend:${{ github.event.workflow_run.head_sha }}
            caiodev027/desafiotecnico-frontend:latest

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cat > docker-compose.yml << EOF
            services:
              backend:
                image: caiodev027/desafiotecnico-backend:${{ github.event.workflow_run.head_sha }}
                container_name: desafiotecnico-backend
                restart: always
                ports:
                  - "8085:8080"
              frontend:
                image: caiodev027/desafiotecnico-frontend:${{ github.event.workflow_run.head_sha }}
                container_name: desafiotecnico-frontend
                restart: always
                ports:
                  - "3005:3000"
            EOF

            docker compose pull
            docker compose up -d
            docker image prune -f
